[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-device-assistant-backend"
version = "0.1.0"
description = "FastAPI and LangGraph laboratory equipment assistant with direct document understanding."
requires-python = ">=3.10"
dependencies = [
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "fastapi>=0.110,<1",
  "langchain-openai>=0.2,<2",
  "langgraph>=0.2,<2",
  "pypdf>=5.0,<7",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=7.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
